<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Tuno — your own music hub. Paste a link from anywhere, keep it forever." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Tuno</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the default colors.
      try {
        var t = JSON.parse(localStorage.getItem('tuno-theme-vars') || localStorage.getItem('vide-theme-vars') || 'null');
        if (t) for (var k in t) document.documentElement.style.setProperty(k, t[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
