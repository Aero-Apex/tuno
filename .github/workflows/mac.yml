# Builds the macOS app on GitHub's Macs (a Mac is needed to compile it).
# Run it by hand from the Actions tab ("Run workflow"): the .dmg and .zip are attached to the run.
# Pushing a version tag (v1.2.0) also builds it and adds the files to that tag's GitHub release.
name: macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Tuno.app
        run: bash mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tuno-mac
          path: |
            mac/dist/Tuno-*.dmg
            mac/dist/Tuno-*-mac.zip

      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is usually created right after the tag is pushed; wait up to 10 minutes for it.
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" mac/dist/Tuno-*.dmg mac/dist/Tuno-*-mac.zip --clobber
